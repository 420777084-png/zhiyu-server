server {
    listen 80;
    server_name 你的域名.cn www.你的域名.cn;

    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 你的域名.cn www.你的域名.cn;

    # SSL 证书（Let's Encrypt 自动管理）
    ssl_certificate /etc/letsencrypt/live/你的域名.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名.cn/privkey.pem;

    # 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头部
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ICP 备案号（工信部要求必须显示）
    # 替换成你的备案号，例如：粤ICP备2026XXXXX号
    # 需要在网站页面底部也显示此备案号

    # 静态文件缓存（图片、CSS、JS）
    location ~* \.(css|js|jpg|jpeg|png|webp|ico|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件路径
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 2M;
    }

    # API 请求代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 2M;
    }

    # 所有其他页面代理到 Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
