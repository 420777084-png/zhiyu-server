services:
  - type: web
    name: zhiyu-medical
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: AUTH_TOKEN
        generateValue: true
      - key: MONGODB_URI
        sync: false
    healthCheckPath: /api/health
    plan: free
